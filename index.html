<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101319">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TetraBoard Lab">
  <meta name="format-detection" content="telephone=no">
  <title>TetraBoard Lab Web</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=40">
</head>
<body>
  <main id="appShell" class="app-shell">
    <header class="top-bar">
      <h1>TetraBoard Lab <span>Mobile</span></h1>
      <div class="top-actions">
        <button id="resetBtn" class="icon-button" type="button" aria-label="Reset board">Reset</button>
        <button id="resetBagBtn" class="icon-button secondary" type="button" aria-label="Reset seven-piece bag">Reset Bag</button>
      </div>
    </header>

    <section class="workspace" aria-label="TetraBoard Lab workspace">
      <aside class="palette-panel" aria-label="Paint palette">
        <button id="holdSlot" class="hold-slot" type="button" aria-label="Hold current piece">
          <span>Hold</span>
          <canvas id="holdCanvas" width="70" height="54" aria-hidden="true"></canvas>
        </button>
        <div id="palette" class="palette"></div>
      </aside>

      <section class="board-panel">
        <canvas id="boardCanvas" class="board" width="360" height="720" aria-label="10 by 20 board"></canvas>
      </section>

      <aside class="piece-panel" aria-label="Piece tray">
        <div id="pieceTray" class="piece-tray"></div>
        <div id="comboBox" class="combo-box" aria-live="polite" hidden>
          <span>Combo</span>
          <strong>0</strong>
        </div>
        <div id="linesBox" class="combo-box lines-box" aria-live="polite" hidden>
          <span>Lines</span>
          <strong>0</strong>
        </div>
        <div id="trainerSwitches" class="trainer-switches" hidden>
          <button id="previewToggleBtn" class="switch-button" type="button" aria-pressed="true">
            <span>Preview</span>
            <strong>5</strong>
          </button>
          <button id="ghostToggleBtn" class="switch-button" type="button" aria-pressed="true">
            <span>Ghost</span>
            <strong>On</strong>
          </button>
          <button id="autoClearToggleBtn" class="switch-button" type="button" aria-pressed="false">
            <span>Auto</span>
            <strong>Off</strong>
          </button>
        </div>
      </aside>
    </section>

    <nav class="action-bar" aria-label="Actions">
      <button class="tool" data-tool="draw" type="button">Draw</button>
      <button class="tool active" data-tool="piece" type="button">Piece</button>
      <button id="fourColumnComboBtn" type="button">4 Wide</button>
      <button id="clearBtn" type="button">Clear Lines</button>
      <button id="undoBtn" type="button">Undo</button>
      <button id="fileBtn" type="button">File</button>
    </nav>
  </main>

  <div id="fileDialog" class="file-dialog" role="dialog" aria-modal="true" aria-labelledby="fileDialogTitle" hidden style="display: none;">
    <section class="file-panel">
      <header class="file-header">
        <h2 id="fileDialogTitle">File</h2>
        <button id="fileCloseBtn" class="file-close" type="button" aria-label="Close file menu">×</button>
      </header>

      <label class="file-label" for="fileNameInput">File name</label>
      <input id="fileNameInput" class="file-name" type="text" maxlength="48" autocomplete="off" placeholder="My board">

      <label class="file-label" for="fileList">Saved boards</label>
      <select id="fileList" class="file-list" size="5" aria-label="Saved boards"></select>
      <p id="fileStatus" class="file-status" role="status" aria-live="polite"></p>

      <div class="file-actions primary">
        <button id="fileSaveBtn" type="button">Save</button>
        <button id="fileLoadBtn" type="button">Load</button>
        <button id="fileDeleteBtn" class="danger" type="button">Delete</button>
      </div>
      <div class="file-actions json">
        <button id="fileExportBtn" type="button">Export JSON</button>
        <button id="fileImportBtn" type="button">Import JSON</button>
      </div>
      <input id="fileImportInput" type="file" accept="application/json,.json" hidden>
    </section>
  </div>

  <script src="./app.js?v=40"></script>
</body>
</html>
